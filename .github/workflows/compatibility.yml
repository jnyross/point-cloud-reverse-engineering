name: compatibility-report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read

jobs:
  bounded-host-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: record available components without installing or enabling them
        run: python3 scripts/compatibility_preflight.py --output compatibility-report.json
      - name: publish probe report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-report-${{ github.run_id }}
          path: compatibility-report.json
          if-no-files-found: error
          retention-days: 30
